[pytest]
asyncio_mode = auto
; NOTE (19 Jul 2026, Windows): app/db/database.py's SQLAlchemy async
; engine is a module-level singleton, created once at import, and
; asyncpg's pooled connections are bound to whichever event loop first
; used them. pytest-asyncio's default is a NEW event loop per test
; function - so test 1 binds the pool to loop A, test 2 gets loop B,
; and its query fails with "attached to a different loop". Forcing one
; shared event loop for the whole session (both fixtures and tests)
; means the engine's pool is only ever used with the loop it started
; on. Linux/macOS didn't hit this in earlier manual testing because the
; underlying symptom (Proactor vs Selector) never came up there, but
; this session-scope fix is correct cross-platform regardless.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
